<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Baoforging - Industrial Forging Excellence</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <!-- Updated Fonts: Manrope (Industrial/Display) & Inter (Clean Corporate Body) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Correct Link for Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d12e3e",  /* NEW: Industrial Red */
                        "primary-dark": "#b91c1c",
                        "accent": "#334155",   /* NEW: Slate/Dark Grey Metallic (Contrast for Red) */
                        "secondary": "#111111", /* Dark Charcoal/Black */
                        "navy": "#0f172a",
                        "background-light": "#ffffff",
                        "background-gray": "#f4f4f4",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "sans": ["Inter", "sans-serif"]
                    },
                    boxShadow: {
                        'industrial': '0 4px 0 0 rgba(0,0,0,0.1)',
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Global Heading Styles for that "Premium Industrial" look */
        h1, h2, h3, h4, h5, h6, .brand-logo-custom {
            font-family: 'Manrope', sans-serif;
            letter-spacing: -0.01em; 
            text-transform: uppercase; /* Industrial standard */
        }

        /* Material Symbols Class Definition - Critical for icons to show as icons, not text */
        .material-symbols-outlined {
          font-family: 'Material Symbols Outlined';
          font-weight: normal;
          font-style: normal;
          font-size: 24px;
          display: inline-block;
          line-height: 1;
          text-transform: none;
          letter-spacing: normal;
          word-wrap: normal;
          white-space: nowrap;
          direction: ltr;
          /* Support for all WebKit browsers. */
          -webkit-font-smoothing: antialiased;
          /* Support for Safari and Chrome. */
          text-rendering: optimizeLegibility;
          /* Support for Firefox. */
          -moz-osx-font-smoothing: grayscale;
          /* Support for IE. */
          font-feature-settings: 'liga';
        }

        .clip-diagonal-r {
            clip-path: polygon(0 0, 100% 0, 90% 100%, 0% 100%);
        }
        
        .clip-diagonal-l {
             clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);
        }

        /* Slanted Section Separator */
        .skewed-separator {
            position: relative;
        }
        .skewed-separator::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: white;
            clip-path: polygon(0 100%, 100% 0, 100% 100%);
        }

        .brand-logo-custom {
            font-weight: 800;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body class="bg-background-light text-slate-900 transition-colors duration-200">
    <div id="root"></div>
</body>
</html>
